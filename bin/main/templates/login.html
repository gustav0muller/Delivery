<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar | Slicer</title>
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body class="account-page">
<header class="topbar">
    <div th:replace="~{fragments/brand :: brand}"></div>
    <a class="back-link" href="/">← Voltar ao cardápio</a>
</header>

<main class="account-main">
    <section class="account-card">
        <p class="eyebrow">BOM TER VOCÊ DE VOLTA</p>
        <h1>Entre na sua conta.</h1>
        <p class="account-copy">Acompanhe seus pedidos e mate a vontade de pizza.</p>
        <div class="notice notice-error" th:if="${error}" th:text="${error}" role="alert"></div>
        <form th:action="@{/login}" th:object="${loginForm}" method="post" class="account-form">
            <label for="email">E-mail</label>
            <input id="email" type="email" th:field="*{email}" autocomplete="email"
                   placeholder="voce@email.com" maxlength="120" required>
            <label for="password">Senha</label>
            <input id="password" type="password" th:field="*{password}" autocomplete="current-password"
                   placeholder="Sua senha" maxlength="72" required>
            <button class="button button-primary" type="submit">Entrar na Slicer <span aria-hidden="true">→</span></button>
        </form>
        <p class="account-switch">Ainda não tem conta? <a href="/cadastro">Criar conta grátis</a></p>
    </section>
</main>

<footer>Feito para quem ama pizza. <span>Slicer © 2026</span></footer>
</body>
</html>
